<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050505" />
    <title>You're offline · PROXIMA</title>
    <style>
      :root { color-scheme: dark light; --bg: #050505; --fg: #f8fafc; --muted: rgb(248 250 252 / 0.68); --line: rgb(255 255 255 / 0.14); }
      @media (prefers-color-scheme: light) { :root { --bg: #f8fafc; --fg: #0f172a; --muted: #475569; --line: rgb(15 23 42 / 0.14); } }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--bg); color: var(--fg); text-align: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      svg { width: 64px; height: 64px; }
      h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em; }
      p { margin: 0; max-width: 22rem; color: var(--muted); line-height: 1.6; font-size: 15px; }
      a {
        display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 28px; border-radius: 16px;
        background: var(--fg); color: var(--bg); font-weight: 800; text-decoration: none;
      }
      a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#050505" stroke="rgba(255,255,255,0.14)" />
      <circle cx="32" cy="32" r="13" fill="#fff" />
      <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#fff" stroke-width="3" transform="rotate(-20 32 32)" />
    </svg>
    <h1>You're offline</h1>
    <p>PROXIMA needs an internet connection to chat. Check your Wi-Fi or mobile data, then try again.</p>
    <!-- An empty link reloads this same address, so no JavaScript is needed. -->
    <a href="">Try again</a>
  </body>
</html>
